AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: On Time Agent — Telugu medicine check-in calls (hackathon pilot, sample data only)

Parameters:
  PilotSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret that holds OPENAI_API_KEY
    AllowedPattern: 'arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+'

Resources:
  Households:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  Site:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  App:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/
      Handler: aws.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      Timeout: 30
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          SECRET_ARN: !Ref PilotSecretArn
          TABLE_NAME: !Ref Households
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref PilotSecretArn
        - DynamoDBCrudPolicy:
            TableName: !Ref Households
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Ring phones at medicine time, for follow-ups, and mark missed calls
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Site
            Method: ANY
            Path: /
        Routes:
          Type: HttpApi
          Properties:
            ApiId: !Ref Site
            Method: ANY
            Path: '/{proxy+}'

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${App}'
      RetentionInDays: 14

Outputs:
  PilotUrl:
    Description: Public HTTPS URL
    Value: !Sub 'https://${Site}.execute-api.${AWS::Region}.${AWS::URLSuffix}/'
